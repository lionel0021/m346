#cloud-config
users: # Configure user accounts.
  - default # Keep the default Ubuntu user.
  - name: lionel # Create the user lionel.
    shell: /bin/bash # Use Bash as the login shell.
    sudo: ALL=(ALL) NOPASSWD:ALL # Allow this user to run sudo without a password.
    groups: sudo # Add the user to the sudo group.
package_update: true # Refresh package lists before installation.
packages: # Install the following packages.
  - fastfetch # Display system information.
  - tree # Display directory structures.
  - jq # Process JSON data as the additional package.
write_files: # Create files during the first boot.
  - path: /home/ubuntu/greeting.txt # Set the path of the greeting file.
    # The following two lines are the literal contents of the greeting file.
    content: | # Write the indented lines as text, preserving line breaks.
      This file was created by cloud-init.
      Nobody created it manually.
  - path: /home/ubuntu/kn01-info.txt # Set the path of the additional file.
    # The next line is the literal content of the additional file.
    content: | # Write the indented line as text.
      KN01: This VM was configured with cloud-init.
runcmd: # Run these commands during the first boot.
  - echo "Installation completed on $(date)" >> /home/ubuntu/greeting.txt # Append the completion time.
  - echo "My custom command was executed" > /home/ubuntu/kn01-proof.txt # Create proof that the custom command ran.
